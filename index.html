<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#000000">
  <title>PocketsFull</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
  </style>
  <script src="https://telegram.org/js/telegram-web-app.js?63"></script>
</head>
<body>
<script>
(async () => {
  const SESSION_ENDPOINT = "https://lfnjernrgkdtfetyoghq.supabase.co/functions/v1/pocketsfull-session";
  const ATTRIBUTION_ENDPOINT = "https://lfnjernrgkdtfetyoghq.supabase.co/functions/v1/pocketsfull-attribution";

  const tg = window.Telegram?.WebApp;
  if (!tg?.initData) throw new Error("Telegram authentication data unavailable");

  try { tg.setHeaderColor?.("#000000"); } catch {}
  try { tg.setBackgroundColor?.("#000000"); } catch {}
  try { tg.setBottomBarColor?.("#000000"); } catch {}
  try { tg.ready?.(); } catch {}
  try { tg.expand?.(); } catch {}

  const sessionResponse = await fetch(SESSION_ENDPOINT, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ initData: tg.initData }),
    cache: "no-store"
  });

  let session = null;
  try { session = await sessionResponse.json(); } catch {}
  if (!sessionResponse.ok || !session?.ok || !session?.targetUrl) {
    throw new Error(session?.error || "Unable to create PocketsFull session");
  }

  for (let attempt = 0; attempt < 2; attempt += 1) {
    try {
      const attributionResponse = await fetch(ATTRIBUTION_ENDPOINT, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ initData: tg.initData }),
        cache: "no-store"
      });
      if (attributionResponse.ok) break;
    } catch {}
    if (attempt === 0) await new Promise((resolve) => setTimeout(resolve, 150));
  }

  window.location.replace(session.targetUrl);
})().catch((error) => {
  console.error("PocketsFull bootstrap failed", error);
});
</script>
</body>
</html>
