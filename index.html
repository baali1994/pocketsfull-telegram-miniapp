<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#000000">
  <title>PocketsFull</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;font-family:Arial,sans-serif}
    #wall{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff}
    #loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#000;color:#fff;font-size:15px;z-index:2}
    #promptBackdrop{position:absolute;inset:0;background:rgba(0,0,0,.38);z-index:20;display:flex;align-items:flex-end;justify-content:center;padding:12px}
    #promptBackdrop[hidden]{display:none}
    #prompt{width:min(520px,100%);background:var(--tg-theme-bg-color,#fff);color:var(--tg-theme-text-color,#111);border-radius:18px;padding:18px 16px calc(16px + env(safe-area-inset-bottom));box-shadow:0 10px 30px rgba(0,0,0,.25)}
    #promptTitle{font-size:19px;font-weight:700;margin:0 0 8px}#promptText{font-size:15px;line-height:1.4;margin:0 0 14px;color:var(--tg-theme-text-color,#222)}
    #promptActions{display:grid;gap:9px}.pfBtn{width:100%;min-height:46px;border:0;border-radius:12px;font-size:15px;font-weight:700;padding:10px 14px;cursor:pointer}.pfPrimary{background:var(--tg-theme-button-color,#2481cc);color:var(--tg-theme-button-text-color,#fff)}.pfSecondary{background:var(--tg-theme-secondary-bg-color,#eceff3);color:var(--tg-theme-text-color,#111)}.pfGhost{background:transparent;color:var(--tg-theme-hint-color,#777)}
  </style>
  <script src="https://telegram.org/js/telegram-web-app.js?63"></script>
</head>
<body>
  <iframe id="wall" title="PocketsFull" allow="clipboard-read; clipboard-write"></iframe>
  <div id="loading">Opening PocketsFull…</div>
  <div id="promptBackdrop" hidden>
    <div id="prompt" role="dialog" aria-modal="true" aria-labelledby="promptTitle">
      <h2 id="promptTitle"></h2>
      <p id="promptText"></p>
      <div id="promptActions">
        <button id="alertsBtn" class="pfBtn pfPrimary" type="button" hidden>Enable survey alerts</button>
        <button id="homeBtn" class="pfBtn pfSecondary" type="button" hidden>Add PocketsFull to Home Screen</button>
        <button id="continueBtn" class="pfBtn pfGhost" type="button">Continue</button>
      </div>
    </div>
  </div>
<script>
(async () => {
  const SESSION_ENDPOINT = "https://lfnjernrgkdtfetyoghq.supabase.co/functions/v1/pocketsfull-session";
  const ATTRIBUTION_ENDPOINT = "https://lfnjernrgkdtfetyoghq.supabase.co/functions/v1/pocketsfull-attribution";
  const FUNNEL_ENDPOINT = "https://lfnjernrgkdtfetyoghq.supabase.co/functions/v1/pocketsfull-funnel";
  const WRITE_ENDPOINT = "https://lfnjernrgkdtfetyoghq.supabase.co/functions/v1/pocketsfull-telegram?action=write-access";
  const wall = document.getElementById("wall"), loading = document.getElementById("loading"), backdrop = document.getElementById("promptBackdrop"), title = document.getElementById("promptTitle"), text = document.getElementById("promptText"), alertsBtn = document.getElementById("alertsBtn"), homeBtn = document.getElementById("homeBtn"), continueBtn = document.getElementById("continueBtn");
  const tg = window.Telegram?.WebApp;
  if (!tg?.initData) throw new Error("Telegram authentication data unavailable");
  const launchAt = Date.now(); let currentState = null, homeStatus = "unknown", promptOpen = false, firstFrameLoad = true;

  try { tg.setHeaderColor?.("#000000"); tg.setBackgroundColor?.("#000000"); tg.setBottomBarColor?.("#000000"); } catch {}
  try { tg.ready?.(); tg.expand?.(); } catch {}

  async function funnel(action="state", extra={}) {
    const r = await fetch(FUNNEL_ENDPOINT,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({initData:tg.initData,action,...extra}),cache:"no-store"});
    const j = await r.json().catch(()=>null); if(!r.ok||!j?.ok) throw new Error(j?.error||"Funnel request failed"); return j;
  }
  async function record(eventType, metadata={}) { try { await funnel("event",{eventType,metadata}); } catch {} }
  function seen(key){try{return localStorage.getItem(key)==="1"}catch{return false}}
  function mark(key){try{localStorage.setItem(key,"1")}catch{}}
  function formatMoney(amount,currency){const n=Number(amount),c=String(currency||"USD").toUpperCase();if(!Number.isFinite(n)||n<=0)return null;try{return new Intl.NumberFormat("en",{style:"currency",currency:c,maximumFractionDigits:2}).format(n)}catch{return `${c} ${n.toFixed(2)}`}}
  function closePrompt(){backdrop.hidden=true;promptOpen=false}
  function showPrompt(kind,state){if(promptOpen)return;promptOpen=true;backdrop.hidden=false;alertsBtn.hidden=true;homeBtn.hidden=true;
    if(kind==="completion"){
      const c=state.latestCompletion||{}, reward=formatMoney(c.local_amount,c.local_currency_code)||formatMoney(c.earned_usd,"USD");
      title.textContent="🎉 Survey completed";
      text.textContent=reward?`You earned ${reward}. Your reward has been added to PocketsFull.`:"Your survey was completed and your reward has been added to PocketsFull.";
      if(!state.writeAccess) alertsBtn.hidden=false;
      if(tg.isVersionAtLeast?.("8.0") && homeStatus!=="added" && homeStatus!=="unsupported" && !state.homeScreenAdded) homeBtn.hidden=false;
    } else {
      title.textContent="Get new survey alerts";
      text.textContent="Survey availability changes during the day. Allow PocketsFull to message you when it’s worth checking again.";
      if(!state.writeAccess) alertsBtn.hidden=false;
    }
  }
  async function refreshState(){try{const s=await funnel("state");currentState=s;const lc=s.latestCompletion,lt=s.latestTerminal;
      if(lc?.trans_id && Date.parse(lc.last_received_at||lc.first_received_at||0)>=launchAt && !seen(`pf_completion_${lc.trans_id}`)){
        mark(`pf_completion_${lc.trans_id}`); await record("write_access_prompted",{context:"completion",trans_id:lc.trans_id}); if(tg.isVersionAtLeast?.("8.0")) await record("home_screen_prompted",{context:"completion",trans_id:lc.trans_id}); showPrompt("completion",s); return;
      }
      if(!s.writeAccess && lt?.trans_id && Date.parse(lt.last_received_at||lt.first_received_at||0)>=launchAt && !seen(`pf_terminal_${lt.trans_id}`)){
        mark(`pf_terminal_${lt.trans_id}`); await record("write_access_prompted",{context:"terminal",trans_id:lt.trans_id,status:lt.normalized_status}); showPrompt("terminal",s);
      }
    }catch(e){console.debug(e)}}
  async function requestAlerts(){alertsBtn.disabled=true;try{if(!tg.isVersionAtLeast?.("6.9")||!tg.requestWriteAccess)throw new Error("Please update Telegram to enable alerts.");tg.requestWriteAccess(async allowed=>{try{const r=await fetch(WRITE_ENDPOINT,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({initData:tg.initData,allowed:Boolean(allowed)}),cache:"no-store"});const j=await r.json().catch(()=>null);if(allowed&&r.ok&&j?.writeAccess){await record("write_access_granted",{context:"post_survey"});alertsBtn.hidden=true;if(currentState)currentState.writeAccess=true}else await record("write_access_denied",{context:"post_survey"})}finally{alertsBtn.disabled=false}})}catch(e){alertsBtn.disabled=false;try{tg.showAlert?.(e?.message||"Unable to enable alerts") }catch{}}}
  function addHome(){homeBtn.disabled=true;record("home_screen_prompted",{context:"button_click"});try{tg.addToHomeScreen?.()}catch{homeBtn.disabled=false}}
  alertsBtn.addEventListener("click",requestAlerts); homeBtn.addEventListener("click",addHome); continueBtn.addEventListener("click",closePrompt);
  try{tg.onEvent?.("homeScreenAdded",async()=>{homeStatus="added";homeBtn.hidden=true;homeBtn.disabled=false;await record("home_screen_added",{});});}catch{}
  if(tg.isVersionAtLeast?.("8.0")&&tg.checkHomeScreenStatus){try{tg.checkHomeScreenStatus(async status=>{homeStatus=String(status||"unknown");if(homeStatus==="added")await record("home_screen_status_added",{});else if(homeStatus==="missed")await record("home_screen_status_missed",{});else if(homeStatus==="unsupported")await record("home_screen_unsupported",{});});}catch{}}

  const sessionResponse = await fetch(SESSION_ENDPOINT,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({initData:tg.initData}),cache:"no-store"});
  const session = await sessionResponse.json().catch(()=>null); if(!sessionResponse.ok||!session?.ok||!session?.targetUrl) throw new Error(session?.error||"Unable to create PocketsFull session");
  for(let attempt=0;attempt<2;attempt++){try{const r=await fetch(ATTRIBUTION_ENDPOINT,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({initData:tg.initData}),cache:"no-store"});if(r.ok)break}catch{}if(attempt===0)await new Promise(r=>setTimeout(r,200))}
  await record("wrapper_loaded",{mode:"expanded",wrapper:"lean_v1"});
  wall.addEventListener("load",()=>{loading.hidden=true;if(firstFrameLoad){firstFrameLoad=false;record("uf_loaded",{});setTimeout(refreshState,2500)}});
  wall.src=session.targetUrl;
  setInterval(refreshState,10000);
})().catch(error=>{console.error("PocketsFull bootstrap failed",error);document.getElementById("loading").textContent="Unable to open PocketsFull. Please close and try again."});
</script>
</body>
</html>
