<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>PocketsFull</title>
  <link rel="stylesheet" href="./style.css">
  <script src="https://telegram.org/js/telegram-web-app.js?63"></script>
</head>
<body>
  <main id="loading" class="shell">
    <section class="card" aria-live="polite">
      <div class="logo">PF</div>
      <h1>PocketsFull</h1>
      <p id="status">Connecting securely to Telegram…</p>
      <div id="error" class="error" hidden></div>
      <button id="retry" type="button" hidden>Try again</button>
    </section>
  </main>

  <section id="wallShell" class="wall-shell" hidden>
    <iframe
      id="wallFrame"
      class="wall-frame"
      title="PocketsFull Earn"
      referrerpolicy="strict-origin-when-cross-origin"
      allow="clipboard-read; clipboard-write; payment"
      allowfullscreen
    ></iframe>
  </section>

  <script>
    window.POCKETSFULL_CONFIG = {
      sessionEndpoint: "https://lfnjernrgkdtfetyoghq.supabase.co/functions/v1/pocketsfull-telegram?action=session"
    };
  </script>
  <script src="./app.js"></script>
</body>
</html>
